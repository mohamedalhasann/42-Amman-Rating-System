<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title></title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<navbar class="main-navbar">
			<div class="logo-container navbar-block">
				<button class="logo-btn">
					<img width="50px" height="50px" src="images/42_logo.svg"/>
				</button>
			</div>
			<div class="navbar-block search-container">
				<form class="search-form">
					<button class="searchbar-btn" type="submit">
						<img class="search-icon" width="28px" height="28px" src="images/search.png"/>
					</button>
					<input class="searchbar" type="search" placeholder="Search">
				</form>
			</div>
			<div class="navbar-block">
				<h3>jsmith</h3>
			</div>
		</navbar>
		<div class="block-holder">
			<div class="info-general">
				<div class="profile-block">
					<img class="profile-pic" width="100px" height="100px" src="images/profile_pic.jpg"/>
					<div class="names">
						<h1 style="margin-bottom: 0;">John Smith</h1>
						<h4 style="margin-top: 0; margin-bottom: 0;">jsmith</h4>
					</div>
					<div class="rate-info">
						<div class="rate-block">
							<h5 style="text-align: left; margin-bottom: 0; margin-top: 4px;">24</h5>
							<h5 style="text-align: left; margin-top: 4px; margin-bottom: 0; font-weight: normal;">Ratings given</h5>
						</div>
						<div class="rate-block">
							<h5 style="text-align: right; margin-bottom: 0; margin-top: 4px;">17</h4>
							<h5 style="text-align: right; margin-top: 4px; margin-bottom: 0; font-weight: normal;">Ratings received</h5>
						</div>
					</div>
				</div>
			</div>
			<div class="info-general">
				<div class="profile-block">
					<h1>Current Rating</h1>
					<div>
						<div class="stars" style="--rating: 2.25;" aria-label="Rating: 2.25 out of 3">
							<div class="stars-empty">★★★</div>
							<div class="stars-fill">★★★</div>
						</div>
					</div>
					<h4>2.25</h4>
				</div>
			</div>
			<div class="info-general list-card">
				<div class="list-block">
					<h1>Available to Rate</h1>
					<div class="list-head">
						<h2>Name</h2>
						<h2>Met via</h2>
					</div>
					<div class="list-element">
						<h3>Jane Doe</h3>
						<h3>Evaluation</h3>
					</div>
					<div class="list-element">
						<h3>Ken Adams</h3>
						<h3>Group project</h3>
					</div>
					<div class="list-element">
						<h3>Marty Mcfly</h3>
						<h3>Evaluation</h3>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
